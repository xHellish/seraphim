<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000308">
    <meta name="description" content="Free PDF search across the web. Every result is checked to be a real PDF.">
    <title>Seraphim Vision</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <!-- Fuente pixel precargada y estilo AXM -->
    <link rel="preload" href="assets/fonts/BitPap.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/axm.css?v=1">
    <link rel="stylesheet" href="styles/main.css?v=10">
</head>

<body class="is_home">
    <div class="ax_background" aria-hidden="true"></div>

    <main class="ax_main">

        <!-- =============================================
             Búsqueda: portada y resultados comparten sección
             --------------------------------------------- -->
        <section class="ax_section" id="search">
            <div class="sv_column">

                <!-- Portada -->
                <header class="sv_hero sv_home_only">
                    <div class="ax_logo_wrap">
                        <span class="ax_glitch_dash ax_glitch_dash_cyan" style="left: -34px; top: 18px; width: 26px;"></span>
                        <span class="ax_glitch_dash ax_glitch_dash_magenta" style="left: -18px; bottom: 6px; width: 30px;"></span>
                        <span class="ax_glitch_dash ax_glitch_dash_red" style="right: -40px; top: 10px; width: 22px;"></span>
                        <h1 class="ax_logo sv_logo ax_glitch_target">Seraphim vision</h1>
                    </div>
                    <p class="ax_subtitle">SERAPHIM // PDF SEARCH</p>
                </header>

                <!-- Título de la vista de resultados -->
                <header class="sv_head sv_results_only">
                    <a id="home-link" class="sv_home_link" href="/">&lt; home</a>
                    <h2 id="results-title" class="ax_title">RESULTS</h2>
                    <p class="ax_subtitle">SERAPHIM // PDF SEARCH</p>
                </header>

                <!-- Barra de búsqueda dentro de una ventana -->
                <form id="search-form" class="sv_search" role="search">
                    <div class="ax_window" style="--accent: var(--cyan);">
                        <div class="ax_frame sv_search_frame" style="--accent: var(--cyan);">
                            <div class="ax_face sv_search_face">
                                <span class="sv_prompt" aria-hidden="true">&gt;</span>
                                <input id="search-input" type="search" name="q" placeholder="search pdfs"
                                    aria-label="Search PDFs" maxlength="200" autocomplete="off" spellcheck="false" required>
                                <button id="search-button" class="ax_frame ax_button ax_button_small" type="submit"
                                    style="--accent: var(--gold_button);">
                                    <span class="ax_face"><span>Search</span></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Sugerencias (solo en la portada) -->
                <div class="sv_suggestions sv_home_only">
                    <p class="ax_section_head">&gt; try:</p>
                    <ul class="ax_tag_list">
                        <li><button class="ax_frame ax_tag sv_suggestion" type="button"><span class="ax_face">linear algebra notes</span></button></li>
                        <li><button class="ax_frame ax_tag sv_suggestion" type="button"><span class="ax_face">kubernetes networking guide</span></button></li>
                        <li><button class="ax_frame ax_tag sv_suggestion" type="button"><span class="ax_face">roman empire history</span></button></li>
                    </ul>
                </div>

                <!-- Terminal de estado (solo en resultados) -->
                <div class="ax_crt sv_status sv_results_only">
                    <div class="ax_crt_screen">
                        <div class="ax_crt_bar">
                            <span>seraphim :: search.log</span>
                            <span class="ax_window_dots" aria-hidden="true"><i></i><i></i><i></i></span>
                        </div>
                        <div id="status-body" class="ax_crt_body" aria-live="polite"></div>
                    </div>
                    <span class="ax_crt_label">STATUS</span>
                </div>

                <ol id="results-list" class="sv_results sv_results_only"></ol>

                <!-- Tarjetas fantasma: ocupan el lugar de los resultados mientras se busca -->
                <ol id="ghost-list" class="sv_results sv_results_only sv_ghost_list" aria-hidden="true" hidden>
                    <li>
                        <div class="ax_frame ax_card sv_ghost" style="--accent: var(--cyan);">
                            <div class="ax_face ax_traces ax_card_face">
                                <span class="sv_ghost_thumb"></span>
                                <div class="sv_ghost_lines">
                                    <span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li>
                        <div class="ax_frame ax_card sv_ghost" style="--accent: var(--violet);">
                            <div class="ax_face ax_traces ax_card_face">
                                <span class="sv_ghost_thumb"></span>
                                <div class="sv_ghost_lines">
                                    <span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li>
                        <div class="ax_frame ax_card sv_ghost" style="--accent: var(--green);">
                            <div class="ax_face ax_traces ax_card_face">
                                <span class="sv_ghost_thumb"></span>
                                <div class="sv_ghost_lines">
                                    <span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span><span class="sv_ghost_bar"></span>
                                </div>
                            </div>
                        </div>
                    </li>
                </ol>

                <div class="sv_more sv_results_only">
                    <button id="load-more-button" class="ax_frame ax_button" type="button" style="--accent: var(--violet);" hidden>
                        <span class="ax_face"><span>Load more</span></span>
                    </button>
                </div>
            </div>
        </section>

        <footer class="sv_footer">
            <p>(c) 2026 Ben Farz // powered by SearXNG</p>
        </footer>
    </main>

    <script src="js/axm.js?v=1"></script>
    <script type="module" src="scripts/app.js?v=5"></script>
</body>

</html>
