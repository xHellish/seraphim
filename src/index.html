<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Free PDF search across the web. Every result is checked to be a real PDF.">
  <title>Seraphim Vision</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeo
    try {
      const saved_theme = localStorage.getItem("theme");
      if (saved_theme === "light" || saved_theme === "dark") {
        document.documentElement.dataset.theme = saved_theme;
      }
    } catch (error) {
      console.warn(`Could not read saved theme: ${error.message}`);
    }
  </script>
</head>
<body class="is-home">
  <header class="top-bar">
    <a id="brand-link" class="brand" href="/" aria-label="Seraphim Vision home">
      <img class="brand-mark" src="assets/logo.svg" alt="" width="36" height="36">
      <span class="brand-name"><span class="brand-accent">Seraphim</span> Vision</span>
    </a>

    <form id="search-form" class="search-form" role="search">
      <label class="visually-hidden" for="search-input">Search PDFs</label>
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="search-input" type="search" name="q" placeholder="Search PDFs across the web" maxlength="200" autocomplete="off" spellcheck="false" required>
      <button id="search-button" class="search-button" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </button>
    </form>

    <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path>
      </svg>
    </button>
  </header>

  <section class="hero">
    <p class="tagline">Free PDF search across the web. Every result is checked to be a real PDF.</p>
    <div class="suggestions" aria-label="Example searches">
      <button class="suggestion" type="button">linear algebra lecture notes</button>
      <button class="suggestion" type="button">kubernetes networking guide</button>
      <button class="suggestion" type="button">history of the roman empire</button>
    </div>
  </section>

  <main class="results-area">
    <div class="results-meta">
      <p id="status-message" class="status-message" aria-live="polite"></p>
      <p id="engine-warning" class="engine-warning" hidden></p>
    </div>
    <ol id="results-list" class="results-list"></ol>
    <div id="skeleton-list" class="skeleton-list" hidden aria-hidden="true">
      <div class="skeleton-item"><span></span><span></span><span></span></div>
      <div class="skeleton-item"><span></span><span></span><span></span></div>
      <div class="skeleton-item"><span></span><span></span><span></span></div>
    </div>
    <button id="load-more-button" class="load-more-button" type="button" hidden>Load more results</button>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Ben Farz · Powered by SearXNG</p>
  </footer>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
