<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seraphim Vision</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="site-header">
    <h1>Seraphim Vision <span class="beta-tag">beta</span></h1>
    <p class="tagline">Free PDF search across the web</p>
    <form id="search-form" class="search-form" role="search">
      <input id="search-input" type="search" name="q" placeholder="Search PDFs..." maxlength="200" autocomplete="off" required>
      <button id="search-button" type="submit">Search</button>
    </form>
  </header>

  <main class="container">
    <p id="status-message" class="status-message" aria-live="polite">Type a topic to find PDF documents.</p>
    <p id="engine-warning" class="engine-warning" hidden></p>
    <ol id="results-list" class="results-list"></ol>
    <button id="load-more-button" class="load-more-button" type="button" hidden>Load more</button>
  </main>

  <footer class="copyright">
    <p>&copy; 2025 Ben Farz. All rights reserved.</p>
  </footer>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
