  <rect x="8" y="4" width="1" height="1" fill="#0F0A1A"/>
  <rect x="7" y="4" width="1" height="1" fill="#9E73F2"/>
  <rect x="4" y="5" width="3" height="1" fill="#9E73F2"/>
  <rect x="4" y="7" width="3" height="1" fill="#9E73F2"/>
  <rect x="4" y="9" width="2" height="1" fill="#9E73F2"/>
  <rect x="4" y="11" width="3" height="1" fill="#9E73F2"/>

  <!-- Lupa: cristal oscuro, aro cian y reflejo -->
