  <rect x="12" y="11" width="1" height="1" fill="#00D9FF"/>
  <rect x="9" y="12" width="3" height="1" fill="#00D9FF"/>
  <rect x="9" y="8" width="1" height="2" fill="#B2FFFF"/>
